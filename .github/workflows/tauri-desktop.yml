name: Tauri App Builds

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: URL embedded as APP_URL in the apps
        required: true
        type: string
      app_version:
        description: Numeric major.minor.build version from the Git tag
        required: true
        type: string
      platforms:
        description: JSON array of platforms to build
        required: true
        default: '["linux","macos","macos-intel","windows","android","ios"]'
        type: string
      request_id:
        description: Unique identifier used by the local build script
        required: false
        default: manual
        type: string

run-name: Tauri app ${{ inputs.app_version }} build ${{ inputs.request_id }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
    runs-on: ${{ matrix.platform == 'linux' && 'ubuntu-24.04' || matrix.platform == 'macos' && 'macos-15' || matrix.platform == 'macos-intel' && 'macos-15-intel' || matrix.platform == 'windows' && 'windows-2025' || matrix.platform == 'android' && 'ubuntu-24.04' || 'macos-15' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Intel macOS Rust target
        if: matrix.platform == 'macos-intel'
        run: rustup target add x86_64-apple-darwin

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set up Android SDK
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        if: matrix.platform == 'android'
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Set up iOS dependencies
        if: matrix.platform == 'ios'
        run: |
          brew install cocoapods
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios

      - name: Write build configuration
        shell: bash
        env:
          APP_URL: ${{ inputs.app_url }}
          APP_VERSION: ${{ inputs.app_version }}
        run: |
          if [[ ! "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Version muss dem Format major.minor.build entsprechen, nur Zahlen sind erlaubt.\n' >&2
            exit 2
          fi
          if [[ "$GITHUB_REF_TYPE" != tag || "$GITHUB_REF_NAME" != "$APP_VERSION" ]]; then
            printf 'APP_VERSION muss dem ausgewählten Git-Tag entsprechen.\n' >&2
            exit 2
          fi
          printf 'APP_URL=%s\n' "$APP_URL" > .env
          mkdir -p build
          jq -n --arg version "$APP_VERSION" '{version: $version}' > build/version.json

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      - name: Build desktop app
        if: matrix.platform == 'linux' || matrix.platform == 'macos' || matrix.platform == 'macos-intel' || matrix.platform == 'windows'
        working-directory: app/bankiva-app
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/build/${{ matrix.platform }}
        run: cargo tauri build --config ../../build/version.json --bundles ${{ matrix.platform == 'linux' && 'appimage' || (matrix.platform == 'macos' || matrix.platform == 'macos-intel') && 'dmg' || 'nsis' }} ${{ matrix.platform == 'macos-intel' && '--target x86_64-apple-darwin' || '' }}

      - name: Initialize Android project
        if: matrix.platform == 'android'
        working-directory: app/bankiva-app
        run: cargo tauri android init --ci --config ../../build/version.json

      - name: Configure Android camera access
        if: matrix.platform == 'android'
        run: python3 bin/configure-android-camera

      - name: Configure Android release signing
        if: matrix.platform == 'android'
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEY_BASE64" || -z "$ANDROID_KEY_PASSWORD" || -z "$ANDROID_KEY_ALIAS" ]]; then
            printf 'Android-Signierung fehlt. GitHub Actions Secrets ANDROID_KEY_BASE64, ANDROID_KEY_PASSWORD und ANDROID_KEY_ALIAS setzen.\n' >&2
            exit 1
          fi
          key_file="$RUNNER_TEMP/bankiva-upload-key.jks"
          printf '%s' "$ANDROID_KEY_BASE64" | base64 --decode > "$key_file"
          signing_dir="app/bankiva-app/src-tauri/gen/android"
          printf 'keyAlias=%s\npassword=%s\nstoreFile=%s\n' \
            "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" "$key_file" > "$signing_dir/keystore.properties"
          python3 bin/configure-android-signing

      - name: Build Android app
        if: matrix.platform == 'android'
        working-directory: app/bankiva-app
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/build/android
        run: cargo tauri android build --apk --aab --config ../../build/version.json

      - name: Initialize iOS project
        if: matrix.platform == 'ios'
        working-directory: app/bankiva-app
        run: cargo tauri ios init --ci --config ../../build/version.json

      - name: Build iOS simulator app
        if: matrix.platform == 'ios'
        working-directory: app/bankiva-app
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/build/ios
        run: cargo tauri ios build --target aarch64-sim --ci --config ../../build/version.json

      - name: Require Apple distribution signing for device and App Store builds
        if: matrix.platform == 'ios'
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
        run: |
          if [[ -z "$IOS_CERTIFICATE" || -z "$IOS_CERTIFICATE_PASSWORD" || -z "$IOS_MOBILE_PROVISION" ]]; then
            printf 'iOS-Geräte- und App-Store-Build benötigt IOS_CERTIFICATE, IOS_CERTIFICATE_PASSWORD und IOS_MOBILE_PROVISION in GitHub Actions Secrets.\n' >&2
            exit 1
          fi

      - name: Build iOS device and App Store package
        if: matrix.platform == 'ios'
        working-directory: app/bankiva-app
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/build/ios
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
        run: cargo tauri ios build --target aarch64 --export-method app-store-connect --ci --config ../../build/version.json

      - name: Package iOS simulator app
        if: matrix.platform == 'ios'
        run: |
          mkdir -p build/ios/artifact
          app_path=$(find app/bankiva-app/src-tauri/gen/apple/build -type d -name '*.app' -path '*arm64-sim*' -print -quit)
          test -n "$app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" build/ios/artifact/bankiva-ios-simulator.zip

      - name: Package iOS App Store IPA
        if: matrix.platform == 'ios'
        run: |
          mkdir -p build/ios/artifact
          ipa_path=$(find app/bankiva-app/src-tauri/gen/apple/build -type f -name '*.ipa' -print -quit)
          test -n "$ipa_path"
          cp "$ipa_path" build/ios/artifact/bankiva-ios-appstore.ipa

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'linux'
        with:
          name: bankiva-linux
          path: build/linux/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'macos'
        with:
          name: bankiva-macos
          path: build/macos/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'macos-intel'
        with:
          name: bankiva-macos-intel
          path: build/macos-intel/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'windows'
        with:
          name: bankiva-windows
          path: build/windows/release/bundle/nsis/*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'android'
        with:
          name: bankiva-android
          path: |
            app/bankiva-app/src-tauri/gen/android/app/build/outputs/**/*.apk
            app/bankiva-app/src-tauri/gen/android/app/build/outputs/**/*.aab
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'ios'
        with:
          name: bankiva-ios
          path: |
            build/ios/artifact/bankiva-ios-simulator.zip
            build/ios/artifact/bankiva-ios-appstore.ipa
          if-no-files-found: error
