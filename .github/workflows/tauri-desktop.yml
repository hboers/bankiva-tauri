name: Tauri Desktop Builds

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: URL embedded as APP_URL in the desktop apps
        required: true
        type: string
      platforms:
        description: JSON array of platforms to build
        required: true
        default: '["linux","macos","windows"]'
        type: string
      request_id:
        description: Unique identifier used by the local build script
        required: false
        default: manual
        type: string

run-name: Tauri desktop build ${{ inputs.request_id }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
    runs-on: ${{ matrix.platform == 'linux' && 'ubuntu-24.04' || matrix.platform == 'macos' && 'macos-15' || 'windows-2025' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Write build configuration
        shell: bash
        env:
          APP_URL: ${{ inputs.app_url }}
        run: printf 'APP_URL=%s\n' "$APP_URL" > .env

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      - name: Build desktop app
        working-directory: app/bankiva-app
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/build/${{ matrix.platform }}
        run: cargo tauri build --bundles ${{ matrix.platform == 'linux' && 'appimage' || matrix.platform == 'macos' && 'dmg' || 'nsis' }}

      - uses: actions/upload-artifact@v4
        with:
          name: bankiva-${{ matrix.platform }}
          path: build/${{ matrix.platform }}/release/bundle/${{ matrix.platform == 'linux' && 'appimage/*.AppImage' || matrix.platform == 'macos' && 'dmg/*.dmg' || 'nsis/*.exe' }}
          if-no-files-found: error
