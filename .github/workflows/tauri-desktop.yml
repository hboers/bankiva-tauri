name: Tauri Desktop Builds

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: URL embedded as APP_URL in the desktop apps
        required: true
        type: string

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux
            bundle: appimage
            artifact-path: tauri/build/linux/release/bundle/appimage/*.AppImage
          - os: macos-14
            name: macos
            bundle: dmg
            artifact-path: tauri/build/macos/release/bundle/dmg/*.dmg
          - os: windows-2022
            name: windows
            bundle: nsis
            artifact-path: tauri/build/windows/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri/app/bankiva-app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Write build configuration
        shell: bash
        env:
          APP_URL: ${{ inputs.app_url }}
        run: printf 'APP_URL=%s\n' "$APP_URL" > .env

      - name: Install frontend dependencies
        working-directory: tauri/app/bankiva-app
        run: npm ci

      - name: Build desktop app
        working-directory: tauri/app/bankiva-app
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/tauri/build/${{ matrix.name }}
        run: npm run tauri build -- --bundles ${{ matrix.bundle }}

      - uses: actions/upload-artifact@v4
        with:
          name: bankiva-${{ matrix.name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
